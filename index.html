<style>
/* Layout: showroom back-office app. Side rail of sections on desktop, bottom tab bar on phones; RTL. Deep navy + brass, like a dealer's ledger. */

  --ok: #6fd39b; --ok-bg: #163426; --warn: #f0b75c; --warn-bg: #3a2c12; --bad: #ff8a80; --bad-bg: #3d1a18;
  --rail: #0a1018; --rail-ink: #93a2b6; --rail-active: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {

  const paid = instPaid(c), today = todayISO();
  const remaining = Math.max(0, total - paid);

  const next = paidInst < months ? addMonths(c.start, paidInst) : null;

    const r = q(), cash = st.sale === "cash";
    if (!st.vehicleId) return err.textContent = "اختر المركبة.";
    if (!st.customerId) return err.textContent = "اختر العميل أو أضف عميلًا جديدًا.";
    const price = numv("cf-price"), down = cash ? price : numv("cf-down");
    if (!price) return err.textContent = "اكتب سعر البيع.";
    if (down > price) return err.textContent = "المقدم أكبر من سعر البيع.";
    let cust, veh;
    if (st.customerId === "new") { cust = readCustomer(); if (!cust.name) return err.textContent = "اكتب اسم العميل الجديد."; }
    else cust = data.customers.find(x => x.id === st.customerId);
    if (st.vehicleId === "new") { veh = { type: val("nv-type"), make: brandName(val("nv-make")), model: val("nv-model"), year: val("nv-year"), plate: val("nv-plate") }; if (!veh.make) return err.textContent = "اكتب ماركة المركبة."; }
    else veh = data.vehicles.find(x => x.id === st.vehicleId);
    const btn = $("cf-save"); btn.disabled = true;
    try {
      const now = new Date().toISOString();
      const customerId = st.customerId === "new" ? await store.add("customers", { ...cust, createdAt: now }) : cust.id;
      const vehicleId = st.vehicleId === "new" ? await store.add("vehicles", { ...veh, cost: numv("cf-cost"), askPrice: price, purchaseDate: todayISO(), status: "sold", createdAt: now }) : veh.id;
      const months = cash ? 0 : numv("cf-months");
      const doc = { customerId, customerName: cust.name, customerPhone: cust.phone || "", vehicleId, vehicleMake: veh.make || "", vehicleLabel: vLabel(veh) + (veh.plate ? " · " + veh.plate : ""), vehicleType: veh.type || "",
        cost: numv("cf-cost"), price, down, months, rate: cash ? 0 : numv("cf-rate"), start: cash ? todayISO() : (val("cf-start") || addMonths(todayISO(), 1)),
        monthly: Math.round(r.monthly * 100) / 100, totalInst: Math.round(r.totalInst * 100) / 100, instProfit: Math.round(r.instProfit), profit: Math.round(r.profit), notes: val("cf-notes"), createdAt: now };
      const cid = await store.add("contracts", doc);
      if (st.vehicleId !== "new") await store.update("vehicles", vehicleId, { status: "sold" });
      if (down > 0) await store.add("payments", { contractId: cid, customerName: cust.name, amount: down, date: todayISO(), method: "نقدي", kind: "down", no: nextReceiptNo(), createdAt: now });
      dlg.close(); toast("تم تسجيل البيع"); go("contracts", cid);
    } catch { btn.disabled = false; err.textContent = "تعذر الحفظ، حاول مرة أخرى."; }
  }
  openDialog("بيع جديد", body, [h("button", { class: "btn", id: "cf-save", type: "submit", form: "cf" }, "حفظ العقد"), h("button", { class: "btn ghost", onclick: () => dlg.close() }, "إلغاء")]);
  upd();
}

function paymentDialog(contractId) {
  const open = data.contracts.map(c => ({ c, s: cstate(c) })).filter(x => x.s.key !== "done");
  if (!open.length) { openDialog("تسجيل دفعة", empty("لا توجد عقود عليها أقساط", "سجّل بيعًا بالتقسيط أولًا.")); return; }
  const err = h("p", { class: "err" }), hint = h("p", { class: "note" });
  const suggest = id => { const x = open.find(o => o.c.id === id); if (!x) return ""; return Math.round(x.s.overdue >= 1 ? x.s.overdue : Math.min(x.c.monthly, x.s.remaining)); };
  const sel = h("select", { id: "pf-c", onchange: e => { $("pf-amt").value = suggest(e.target.value); hintUpd(); } },
    h("option", { value: "" }, "اختر العقد…"), open.map(({ c, s }) => h("option", { value: c.id, selected: c.id === contractId }, c.customerName + " · " + c.vehicleLabel + (s.overdue ? " · متأخر " + nf.format(Math.round(s.overdue)) : ""))));
  function hintUpd() { const x = open.find(o => o.c.id === $("pf-c").value); hint.textContent = x ? "القسط " + money(x.c.monthly) + " · المتبقي " + money(x.s.remaining) + (x.s.overdue ? " · المتأخر " + money(x.s.overdue) : "") : ""; }
  const body = h("form", { id: "pf", class: "fgrid", onsubmit: async e => {
    e.preventDefault(); const cid = val("pf-c"), amount = numv("pf-amt"), x = open.find(o => o.c.id === cid);
    if (!x) return err.textContent = "اختر العقد.";
    if (amount <= 0) return err.textContent = "اكتب المبلغ.";
    if (amount > x.s.remaining + 1) return err.textContent = "المبلغ أكبر من المتبقي على العميل (" + money(x.s.remaining) + ").";
    $("pf-save").disabled = true;
    const p = { contractId: cid, customerName: x.c.customerName, amount, date: val("pf-date") || todayISO(), method: val("pf-m"), note: val("pf-note"), kind: "inst", no: nextReceiptNo(), createdAt: new Date().toISOString() };
    try { await store.add("payments", p); receiptDialog(p); } catch { $("pf-save").disabled = false; err.textContent = "تعذر الحفظ، حاول مرة أخرى."; }
  } },
    h("label", { class: "f wide" }, "العقد", sel), h("div", { class: "wide" }, hint),
    inp("pf-amt", "المبلغ المستلم", { type: "number", min: "1", step: "1", value: contractId ? suggest(contractId) : "" }),
    inp("pf-date", "تاريخ الاستلام", { type: "date", value: todayISO() }),
    h("label", { class: "f" }, "طريقة الدفع", h("select", { id: "pf-m" }, METHODS.map(m => h("option", null, m)))),
    inp("pf-note", "ملاحظة", { placeholder: "اختياري" }), h("div", { class: "wide" }, err));
  openDialog("تسجيل دفعة", body, [h("button", { class: "btn", id: "pf-save", type: "submit", form: "pf" }, "حفظ وإصدار إيصال"), h("button", { class: "btn ghost", onclick: () => dlg.close() }, "إلغاء")]);
  hintUpd();
}
function receiptDialog(p) {
  const c = data.contracts.find(x => x.id === p.contractId) || {};
  const s = c.id ? cstate(c) : null;
  if (s && p.kind !== "down" && !data.payments.some(x => x.no === p.no && x.contractId === p.contractId)) s.remaining = Math.max(0, s.remaining - p.amount);
  const text = [S().name + " " + S().tagline, "إيصال استلام رقم " + rno(p.no), "التاريخ: " + fd(p.date), "استلمنا من: " + (c.customerName || p.customerName || ""), "مبلغ: " + money(p.amount) + " (" + (p.kind === "down" ? "مقدم" : (p.method || "")) + ")", "عن: " + (c.vehicleLabel || ""), s ? "المتبقي بعد الدفعة: " + money(s.remaining) : ""].filter(Boolean).join("\n");
  openDialog("إيصال استلام", h("div", { class: "receipt" },
    h("div", { class: "rh" }, h("b", null, S().name), h("span", { class: "num" }, "رقم " + rno(p.no))),
    h("div", null, "استلمنا من السيد/ة ", h("b", null, c.customerName || p.customerName || "")),
    h("div", { class: "amt" }, money(p.amount)),
    h("div", { class: "note" }, (p.kind === "down" ? "مقدم" : "قسط") + " · " + (p.method || "نقدي") + " · " + fd(p.date)),
    h("div", { class: "note" }, "عن: " + (c.vehicleLabel || "")),
    s ? h("div", { class: "note" }, "المتبقي على العميل بعد الدفعة: " + money(s.remaining)) : null,
    p.note ? h("div", { class: "note" }, p.note) : null),
    [h("button", { class: "btn", onclick: () => copyText(text) }, "نسخ الإيصال للواتساب"), h("button", { class: "btn ghost", onclick: () => dlg.close() }, "تم")]);
}

// ---------- boot ----------
$("brands-dl").replaceChildren(...BRANDS.map(b => h("option", { value: b[0] }, b[1])));
buildNav(); buildTopbar(); applySettings();
render();
dlg.addEventListener("close", () => scheduleRender());
(async () => {
  if (window.claude && window.claude.use) {
    try { db = await window.claude.use("db"); } catch { db = null; }
    if (!db) return useLocal();
    backend = "db"; noteStore();
    const loaded = new Set();
    COLS.forEach(col => db.collection(col).onSnapshot(snap => {
      data[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (col === "settings") applySettings();
      loaded.add(col); if (loaded.size === COLS.length) mode = "db";
      if (dlg.open) return; // don't rebuild under an open form; refresh when it closes
      scheduleRender();
    }, () => { if (mode !== "local") useLocal(); }));
    return;
  }
  const cfg = sbConfig();
  if (cfg && cfg.url && cfg.key) return sbStart(cfg);
  useLocal();
})();
})();
</script>
</body></html>
